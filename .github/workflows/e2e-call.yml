name: E2E Call

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-call:
    name: Two-client audio call (${{ matrix.sdk }} SDK)
    runs-on: ubuntu-latest
    # Generous: an uncached build of matrix-sdk alone takes ~25-45 minutes.
    # With a warm rust-cache the whole job is ~10 minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Two SDKs, two feature sets. `upstream` is the workspace's default
      # (matrix-org/matrix-rust-sdk) and can only run the pre-sticky scenario —
      # the sticky ones are compiled out without `experimental-sticky`. `sticky`
      # runs the whole suite through scripts/cargo-sticky.sh, which redirects
      # the SDK to the MSC4354 fork and passes its `unstable-msc4354` feature.
      matrix:
        include:
          - sdk: upstream
            cargo: cargo
            features: matrix-sdk,testing
            target_dir: target
          - sdk: sticky
            cargo: ./scripts/cargo-sticky.sh
            features: matrix-sdk,testing,experimental-sticky,matrix-sdk/unstable-msc4354,matrix-sdk-ui/unstable-msc4354
            target_dir: target/sticky
    steps:
      - uses: actions/checkout@v4

      # Start the backend first so image pulls and Synapse's first boot overlap
      # the (much longer) rust build.
      - name: Start MatrixRTC backend
        run: docker compose -f demo/backend/docker-compose.yml up -d --wait

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # matrix-rtc-livekit pulls in livekit/webrtc-sys, whose build script
      # shells out to pkg-config for glib-2.0 (the prebuilt linux libwebrtc
      # dynamically links it). Same dependency the Lint workflow installs.
      - name: Install webrtc-sys system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev

      # Per-SDK key: the two legs resolve different matrix-sdk trees and build
      # into different target directories. The `sticky` key is shared with the
      # Lint workflow's clippy-sticky job.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.sdk == 'upstream' && 'e2e-call' || 'sticky' }}
          workspaces: ". -> ${{ matrix.target_dir }}"

      # Build without running so a compile failure is distinguishable from a
      # call failure, and the stack gets extra minutes to settle.
      - name: Build e2e test
        run: ${{ matrix.cargo }} test -p matrix-rtc-livekit --features ${{ matrix.features }} --test e2e_call --no-run

      - name: Wait for backend readiness
        run: ./demo/backend/wait-ready.sh

      - name: Run e2e call test
        # --test-threads=1: the scenarios share the compose stack; run them
        # sequentially.
        run: ${{ matrix.cargo }} test -p matrix-rtc-livekit --features ${{ matrix.features }} --test e2e_call -- --ignored --nocapture --test-threads=1
        env:
          # `debug` on our own crates: this is the only CI job that exercises a
          # real join end to end, so its log is the reference for what a healthy
          # sequence looks like. `livekit`/`webrtc_sys` stay at `warn` — at
          # `debug` they are most of the output.
          RUST_LOG: info,matrix_rtc_core=debug,matrix_rtc_media=debug,matrix_rtc_livekit=debug,livekit=warn,webrtc_sys=warn

      # Always, not just on failure: the auth-service (lk-jwt) logs are the
      # only visibility into the OpenID/token hop, and green runs that log
      # oddities are how drift gets spotted early.
      - name: Backend logs
        if: always()
        run: docker compose -f demo/backend/docker-compose.yml logs --no-color

      # The recorded audio is the best evidence when tone detection fails.
      - name: Upload recorded audio
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-received-wav-${{ matrix.sdk }}
          # The test writes next to the manifest, not into CARGO_TARGET_DIR, so
          # the path is the same for both legs.
          path: target/e2e/*.wav
          if-no-files-found: ignore

      - name: Teardown backend
        if: always()
        run: docker compose -f demo/backend/docker-compose.yml down -v
