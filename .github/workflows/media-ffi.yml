# Builds matrix-rtc-ffi with the `media` feature (uniffi codegen + the
# transport-agnostic media surface over libwebrtc) and runs its in-process
# smoke tests — no SFU or homeserver needed. The plain workspace CI never
# compiles this combination because the feature is off by default.

name: Media FFI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-ffi:
    name: FFI with media feature
    runs-on: ubuntu-latest
    # Uncached, the libwebrtc-carrying build takes a while; warm cache brings
    # the job to a few minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # webrtc-sys's build script shells out to pkg-config for glib-2.0 (the
      # prebuilt linux libwebrtc dynamically links it).
      - name: Install webrtc-sys system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: media-ffi

      - name: Clippy (media feature)
        run: cargo clippy -p matrix-rtc-ffi --features media -- -D warnings

      - name: Smoke tests (media feature)
        run: cargo test -p matrix-rtc-ffi --features media
