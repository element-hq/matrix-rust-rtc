[package]
name = "matrix-rtc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# No `time`: the core deliberately arms no timers, so it needs no reactor and a
# synchronous host can drive it from a plain thread. The MSC4143
# `delayBeforeUse` wait is handed to the consumer as
# `KeyMaterialSignal::use_after_ms` instead. Leaving the feature off makes that
# a compile error to regress rather than a runtime panic on Android.
tokio = { workspace = true }
log.workspace = true
async-trait.workspace = true
rand = "0.8"
rand_core = "0.6"
base64 = "0.21"
# Element Call keeps only the first grapheme of a reaction's emoji; a grapheme
# is not a `char` (one visible emoji can be several code points joined), so
# this pure-Rust, wasm-safe segmenter does the split.
unicode-segmentation = "1"

# `rand` reaches getrandom 0.2, which has no wasm entropy source unless its
# `js` feature is on and refuses to compile for wasm32-unknown-unknown without
# it. Lives here — where the `rand` dependency is — so every crate over the
# core checks for wasm32 without repeating it.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# `std::time::SystemTime::now()` PANICS on wasm32-unknown-unknown (std has no
# clock there); web-time is the drop-in that reads `Date.now()` instead. A
# clock read only — the no-timers rule above is untouched.
web-time = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "test-util", "time", "sync"] }
futures = "0.3"

