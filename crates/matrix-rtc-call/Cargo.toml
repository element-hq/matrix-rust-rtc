[package]
name = "matrix-rtc-call"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The call application over matrix-rtc-core: Element Call reactions, the raised hand, and MSC4075 notifications."

[dependencies]
matrix-rtc-core = { path = "../matrix-rtc-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Sync primitives only: tasks and timers go through `matrix_rtc_core::executor`,
# never `tokio::time`, which panics on wasm32-unknown-unknown.
tokio = { workspace = true }
log.workspace = true
# `DialectBackend` wraps the host's `MatrixBackend`, an async trait.
async-trait.workspace = true
# Element Call keeps only the first grapheme of a reaction's emoji; a grapheme
# is not a `char` (one visible emoji can be several code points joined), so
# this pure-Rust, wasm-safe segmenter does the split.
unicode-segmentation = "1"

# `std::time::SystemTime::now()` PANICS on wasm32-unknown-unknown (std has no
# clock there); web-time is the drop-in that reads `Date.now()` instead.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

[dev-dependencies]
matrix-rtc-core = { path = "../matrix-rtc-core", features = ["testing"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "test-util", "time", "sync"] }
