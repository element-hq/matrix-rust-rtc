[package]
name = "matrix-rtc-call"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The call application over matrix-rtc-core: Element Call reactions, the raised hand, and MSC4075 notifications."

[dependencies]
matrix-rtc-core = { path = "../matrix-rtc-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync` only, like the core: the call layer arms no timers either.
tokio = { workspace = true }
log.workspace = true
# Element Call keeps only the first grapheme of a reaction's emoji; a grapheme
# is not a `char` (one visible emoji can be several code points joined), so
# this pure-Rust, wasm-safe segmenter does the split.
unicode-segmentation = "1"

# `std::time::SystemTime::now()` PANICS on wasm32-unknown-unknown (std has no
# clock there); web-time is the drop-in that reads `Date.now()` instead.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1"

[dev-dependencies]
matrix-rtc-core = { path = "../matrix-rtc-core", features = ["testing"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
