[package]
name = "matrix-rtc-livekit-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The pure MSC4195 LiveKit control plane: identity derivations, token exchange shapes, and dialect selection. No IO, no libwebrtc — compiles for wasm32."

[dependencies]
# `RtcIdentityMapper`, the identity seam `identity_mapper` produces, and the
# pre-2026 membership formats (`compat`) the identity/endpoint choices key on.
matrix-rtc-core = { path = "../matrix-rtc-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
sha2 = "0.10"
base64 = "0.22"
